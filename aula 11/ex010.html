<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistemas de multas</h1>
    Velocidade do veiculo: <input type="number" name="vel" id="txtvel">
    <input type="button" value="verificar" onclick="calcular()">
    <div id="res">

    </div>
    <script>
        
        function calcular(){
            var txtv = document.getElementById('txtvel')
            var res = document.getElementById('res')
            var vel = Number(txtv.value)
            res.innerHTML = `<p>Sua velocidade atual é de ${vel} km/h.</p>`
            res.innerHTML += `<p> dirija sempre usando cinto de segurança!</p>`
            if (vel > 60) {
                res.innerHTML += `<p>Você ultrapassou a velocidade permitida. MULTADO!</p>`
            }

        }
    </script>
</body>
</html>
