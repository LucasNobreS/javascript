<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
     <h1>Sistemas de nacionalidade</h1>
    Digite sua nacionalidade: <input type="text" name="nacional" id="txtnacional">
    <input type="button" value="verificar" onclick="verificar()">
    <div id="res">

    </div>
    <script>
        
        function verificar(){
            var txtNacional = document.getElementById('txtnacional')
            var nacional = txtNacional.value
            if (nacional == 'brasileiro') {
                res.innerHTML = `<p>Você é brasileiro!</p>`
            } else {
                res.innerHTML = `<p>Você é estrangeiro!</p>`
            }
        }
    </script>
</body>
</html>
