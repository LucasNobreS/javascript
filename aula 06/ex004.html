<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font: normal 20pt arial;
        }
    </style>
</head>
<body>

    <script>//formatar string
        var nome = window.prompt("Qual é o seu nome?")
        document.write(`Seu nome tem <strong>${nome.length}</strong> letras.<br/>`);
        document.write(`seu nome em maiúsculo é ${nome.toUpperCase()} <br/>`);
        document.write(`seu nome em minúsculo é ${nome.toLowerCase()} <br/>`);



        
    </script>
</body>
</html>
